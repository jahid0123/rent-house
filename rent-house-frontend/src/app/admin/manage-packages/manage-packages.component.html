<div id="packagesGridContainer" class="container my-4">

  <div class="card shadow-sm">
    <div class="card-header d-flex justify-content-between align-items-center">
      <div>
        <h5 class="mb-0">Credit Packages</h5>
        <small class="text-muted">Manage packages</small>
      </div>
      <div class="d-flex gap-2 align-items-center">
        <div class="input-group input-group-sm" style="min-width:220px">
          <span class="input-group-text"><i class="bi bi-search"></i></span>
          <input type="search" class="form-control" placeholder="Search packages..." [(ngModel)]="filterText" (input)="applyFilter()" />
        </div>
        <button class="btn btn-sm btn-outline-secondary" (click)="applyFilter()" title="Refresh filter">
          <i class="bi bi-arrow-clockwise"></i>
        </button>
        <button class="btn btn-sm btn-primary" (click)="openAddModal()"> Add</button>
      </div>
    </div>
    <div class="card-body p-2">
      <div class="table-responsive packages-grid-wrapper">
        <table class="table table-hover table-bordered align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th class="text-center">Actions</th>
              <th>ID</th>
              <th>Name</th>
              <th>Credits</th>
              <th>Price (BDT)</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let pkg of allCreditPackage">
              <td class="text-center">
                <button type="button" class="btn btn-sm btn-outline-primary me-1" (click)="openEditModal(pkg)" title="Edit">
                  <i class="bi bi-pencil-square"></i>
                </button>
                <button type="button" class="btn btn-sm btn-outline-danger" (click)="deletePackage(pkg.id)" title="Delete">
                  <i class="bi bi-trash"></i>
                </button>
              </td>
              <td>{{ pkg.id }}</td>
              <td>{{ pkg.name }}</td>
              <td>{{ pkg.creditAmount }}</td>
              <td>{{ pkg.price | number }}</td>
            </tr>
            <tr *ngIf="allCreditPackage.length === 0">
              <td colspan="5" class="text-center text-muted py-4">No packages found.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Modal -->
<div 
  class="modal fade show" 
  tabindex="-1" 
  [ngStyle]="{ display: showModal ? 'block' : 'none', backgroundColor: 'rgba(0,0,0,0.5)' }"
  *ngIf="showModal"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content rounded-4 shadow-lg">
      <div class="modal-header">
        <h5 class="modal-title text-primary">
          <i class="bi bi-pencil-fill me-2"></i>
          {{ isEditMode ? 'Edit Package' : 'Add New Package' }}
        </h5>
        <button type="button" class="btn-close" (click)="closeModal()"></button>
      </div>

      <form (ngSubmit)="savePackage()" #pkgForm="ngForm">
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label fw-semibold">Package Name</label>
            <input
              type="text"
              class="form-control"
              [(ngModel)]="selectedPackage.name"
              name="name"
              required
            />
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Credits</label>
            <input
              type="number"
              class="form-control"
              [(ngModel)]="selectedPackage.creditAmount"
              name="creditAmount"
              required
              min="1"
            />
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Price (BDT)</label>
            <input
              type="number"
              class="form-control"
              [(ngModel)]="selectedPackage.price"
              name="price"
              required
              min="1"
            />
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" (click)="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-save me-1"></i> {{ isEditMode ? 'Update' : 'Save' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
